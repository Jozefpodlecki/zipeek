[workspace]
members = [
    "crates/zipeek-db-gen",
    "crates/zipeek-core",
    "crates/zipeek-exercises",
    "crates/zipeek-hanzi-writing",
    "crates/zipeek-ai-core",
    "crates/zipeek-ai-protocol",
    "crates/zipeek-ai-server",
    "crates/zipeek-ai-client",
    "crates/zipeek-ui",
    "crates/zipeek-browser",
    "crates/zipeek-themes",
    "crates/zipeek-web",
    "crates/zipeek-db",
    "crates/zipeek-app",
    "crates/zipeek-e2e",
    "crates/zipeek-image-server",
    "crates/zipeek-static-server",
    "crates/zipeek-cli",
    "crates/zipeek-geo-assets",
    "crates/zipeek-docs",
    "crates/zipeek-pedagogy",
    "crates/zipeek-tts-stt"
]
default-members = [
    "crates/zipeek-db-gen",
    "crates/zipeek-core",
    "crates/zipeek-exercises",
    "crates/zipeek-hanzi-writing",
    "crates/zipeek-ai-core",
    "crates/zipeek-ai-protocol",
    "crates/zipeek-ai-server",
    "crates/zipeek-ai-client",
    "crates/zipeek-ui",
    "crates/zipeek-browser",
    "crates/zipeek-themes",
    "crates/zipeek-db",
    "crates/zipeek-e2e",
    "crates/zipeek-image-server",
    "crates/zipeek-static-server",
    "crates/zipeek-cli",
    "crates/zipeek-geo-assets",
    "crates/zipeek-docs",
    "crates/zipeek-pedagogy"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
repository = "https://github.com/Jozefpodlecki/zipeek"
description = ""
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
uuid = "1.29.2"
yew = { version = "0.23" }
tokio = { version = "=1.54.1", features = ["full"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
axum = { version = "=0.8.9", features = ["json"] }
flate2 = "1.1.11"
sha2 = { version = "=0.11.1" }
thiserror = "=2.0.21"
futures-util = "=0.3.34"
futures = "0.3.29"
log = "0.4.35"
tracing = "0.1.44"
chrono = { version = "0.4.44", features = ["serde"] }