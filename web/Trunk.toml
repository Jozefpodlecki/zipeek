[build]
target = "./index.html"
locked = true

[serve]
port = 1420
open = false

[tools]
wasm_bindgen = "0.2.114"
tailwindcss = "4.3.3"

[watch]
watch = [
    ".",
    "../crates/zipeek-core",
    "../Cargo.toml",
    "../Cargo.lock",
    "../rust-toolchain.toml"
]
ignore = [
    "dist/**",
    "target/**",
    "node_modules/**",
    "vendor/**"
]

[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["scripts/prepare-duckdb.cjs"]
