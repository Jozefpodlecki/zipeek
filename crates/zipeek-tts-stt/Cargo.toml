candle-transformers = { version = "0.11.1", features = ["cuda"] }
candle-kernels = { version = "0.11.1" }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac"] }
opus-pure = "=0.2.3"
shine-rs = "=0.1.5"
serde_json = { workspace = true }

