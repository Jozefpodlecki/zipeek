[package]
name = "zipeek-db-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
aimux-core = { version = "0.6.0" }
aimux-providers = { version = "0.6.0" }
zipeek-core = { path = "../zipeek-core" }
futures-util = { version = "0.3.34" }
tokio = { workspace = true }
zipeek-ai-protocol = { path = "../zipeek-ai-protocol" }
zipeek-db = { path = "../zipeek-db", features = ["native"] }
