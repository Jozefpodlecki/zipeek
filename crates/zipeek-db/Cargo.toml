
[package]
name = "zipeek-db"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

native = [
    "dep:duckdb-neo",
]

wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:web-sys",
]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.duckdb-neo]
git = "https://github.com/duckdb/duckdb-rs.git"
rev = "4acbea84794582c4cd962ee971a3d7a5dcb72e39"
features = ["chrono", "r2d2", "uuid"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true , optional = true }
serde-wasm-bindgen = { workspace = true , optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Document", "Url", "Worker", "Request", "RequestInit", "RequestCache", "AbortSignal", "Blob", "ReadableStream", "Response", "Crypto", "SubtleCrypto"] }
