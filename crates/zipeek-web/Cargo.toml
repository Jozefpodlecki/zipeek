[package]
name = "zipeek-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["wasm", "web", "yew"]
categories = ["wasm", "web-programming"]

[dependencies]
yew = { workspace = true, features = ["csr"] }
yew-router = "0.20.0"
yew_icons = { version = "0.11.0", features = ["lucide", "simple_icons"]}
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
futures = { workspace = true }
log = { workspace = true }
wasm-logger = "0.2.0"
gloo = "0.12"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { workspace = true, features = ["v7", "js"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
thiserror = { workspace = true }
animato = { version = "1.7.3", features = ["path", "physics", "color"] }
zipeek-core = { path = "../zipeek-core" }
zipeek-exercises = { path = "../zipeek-exercises" }
zipeek-docs = { path = "../zipeek-docs" }
zipeek-pedagogy = { path = "../zipeek-pedagogy" }
zipeek-hanzi-writing = { path = "../zipeek-hanzi-writing" }
zipeek-ai-protocol = { path = "../zipeek-ai-protocol" }
zipeek-ai-client = { path = "../zipeek-ai-client" }
zipeek-themes = { path = "../zipeek-themes" }
zipeek-db = { path = "../zipeek-db", features = ["wasm"] }
zipeek-ui = { path = "../zipeek-ui" }
zipeek-browser = { path = "../zipeek-browser" }

[dependencies.web-sys]
workspace = true
features = [
    "console",
    "Document",
    "Location",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "MouseEvent",
    "DragEvent",
    "DataTransfer",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "PointerEvent",
    "DomTokenList",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "PromiseRejectionEvent",
    "DomStringMap",
    "Blob",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "Url",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "BroadcastChannel"
]

[[bin]]
name = "pedagogy_worker"
path = "src/bin/pedagogy_worker/mod.rs"
