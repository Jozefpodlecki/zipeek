[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
description = "List the explicit database and development tasks"
command = "cargo"
args = ["make", "--list-all-steps"]

[tasks.duckdb-env]
description = "Resolve the pinned Windows DuckDB import library and runtime DLL for native generator tasks"
condition = { platforms = ["windows"] }
script_runner = "@duckscript"
script = '''
root = get_env CARGO_MAKE_WORKING_DIRECTORY
configured = get_env DUCKDB_LIB_DIR
if is_empty ${configured}
    directory = set "${root}/target/duckdb-download/x86_64-pc-windows-msvc/v2.0.0"
else
    directory = set "${configured}"
end
import_library = set "${directory}/duckdb.lib"
runtime_library = set "${directory}/duckdb.dll"
import_exists = is_path_exists ${import_library}
dll_exists = is_path_exists ${runtime_library}
if not ${import_exists}
    echo "Missing DuckDB v2.0.0 import library: ${import_library}"
    exit 1
end
if not ${dll_exists}
    echo "Missing DuckDB v2.0.0 runtime library: ${runtime_library}"
    exit 1
end
set_env DUCKDB_LIB_DIR "${directory}"
old_path = get_env PATH
set_env PATH "${directory};${old_path}"
'''

[tasks.db-check]
dependencies = ["duckdb-env"]
description = "Validate pinned inputs and import in memory; write no database"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-gen", "check"]

[tasks.db-browse-check]
dependencies = ["duckdb-env"]
description = "Verify the installed dictionary bundle and required Browse tables using the Rust CLI"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-browse-check"]

[tasks.db-generator-build]
dependencies = ["duckdb-env"]
description = "Build the CLI that orchestrates native dictionary generation"
command = "cargo"
args = ["build", "--quiet", "--release", "--locked", "-p", "zipeek-cli"]

[tasks.db-generate]
description = "Generate and validate a fresh dictionary candidate using native Rust"
dependencies = ["duckdb-env", "db-generator-build"]
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-generate"]

[tasks.db-ai-smoke]
dependencies = ["duckdb-env"]
description = "Test a single sense and 100 real imported senses in one LM Studio batch without database/cache writes"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-gen", "ai-workflow", "--smoke"]

[tasks.db-classify-cache]
dependencies = ["duckdb-env"]
description = "Prepare/validate a classification cache and exit, releasing DuckDB before the next Cargo build"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-gen", "ai-workflow", "--classify-only"]

[tasks.db-generate-enriched]
description = "Generate a classified candidate from the validated cache using Rust"
dependencies = ["duckdb-env", "db-generator-build"]
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-generate", "--selected-classification-cache"]

[tasks.db-classify]
description = "Prepare classifications, then generate an enriched candidate in a separate process; never install"
dependencies = ["db-classify-cache", "db-generate-enriched"]

[tasks.db-install-enriched]
dependencies = ["duckdb-env"]
description = "Install only an enriched candidate after verifying the bundle"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-install", "--require-enrichment"]

[tasks.db-full]
description = "Offline classification, enriched generation and verified atomic installation without nested Cargo builds"
dependencies = ["db-classify", "db-compress", "db-install-enriched"]

[tasks.db-full-dev]
description = "Generate and install the offline-classified database, then start Trunk"
dependencies = ["db-full", "serve"]

[tasks.db-install]
dependencies = ["duckdb-env"]
description = "Install the latest verified full bundle using native zipeek-cli"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-install"]

[tasks.web-install]
dependencies = ["duckdb-env"]
description = "Install locked npm dependencies explicitly, never during a Trunk build"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "install"]

[tasks.prepare-duckdb]
dependencies = ["duckdb-env"]
description = "Prepare DuckDB and Arrow vendor assets using Rust"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "prepare-duckdb"]

[tasks.prepare-summary]
dependencies = ["duckdb-env"]
description = "Prepare summary vendor bundle only when its inputs change"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "prepare-summary"]

[tasks.prepare-assets]
dependencies = ["duckdb-env"]
description = "Prepare or reuse the DuckDB and summary vendor bundles"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "prepare"]

[tasks.prepare-hanzi]
dependencies = ["duckdb-env"]
description = "Prepare licensed Hanzi reference assets using Rust; sparse-clones the upstream data/ and ARPHICPL.TXT on first run"
command = "cargo"
args = ["run", "--locked", "-p", "zipeek-cli", "--", "hanzi", "prepare"]

[tasks.setup-all]
description = "Set up web assets, backgrounds and Hanzi references (Rust downloads only licensed upstream data and notice)"
dependencies = ["setup", "prepare-backgrounds", "prepare-hanzi", "docs"]

[tasks.verify-assets]
dependencies = ["duckdb-env"]
description = "Fail fast if web vendor assets are absent or stale"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "verify"]

[tasks.setup]
description = "Explicit first-time npm install and vendor preparation"
dependencies = ["web-install", "prepare-assets"]

[tasks.docs]
dependencies = ["duckdb-env"]
description = "Generate the Docs search index; Trunk copies the source docs tree directly"
command = "cargo"
args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "docs"]

[tasks.docs-validate]
dependencies = ["duckdb-env"]
 description = "Validate Docs index, linked sources, artwork and worker bootstrap using Rust"
 command = "cargo"
 args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "verify-assets"]

[tasks.serve]
description = "Verify prepared vendor assets and serve at http://localhost:1420"
dependencies = ["verify-assets"]
cwd = "crates/zipeek-web"
command = "trunk"
args = ["serve"]

[tasks.dev]
description = "Generate, install the complete bundle, then start Trunk"
dependencies = ["db-generate", "db-compress", "db-install", "serve"]

[tasks.desktop-servers-build]
description = "Compile debug AI, image and speech server executables"
command = "cargo"
args = ["build", "--locked", "-p", "zipeek-ai-server", "-p", "zipeek-image-server", "-p", "zipeek-tts-stt"]

[tasks.desktop-sidecars]
dependencies = ["duckdb-env"]
 description = "Stage prebuilt debug sidecars via the existing CLI; never build implicitly"
 command = "target/debug/zipeek-cli.exe"
 args = ["desktop-sidecars"]

[tasks.debug-cli-build]
dependencies = ["duckdb-env"]
description = "Explicitly build debug CLI before staging sidecars"
command = "cargo"
args = ["build", "--locked", "-p", "zipeek-cli"]

[tasks.desktop-sidecars-rebuild]
description = "Explicitly rebuild debug services and CLI, then stage sidecars"
dependencies = ["desktop-servers-build", "debug-cli-build", "desktop-sidecars"]

[tasks.desktop-servers-build-release]
description = "Compile release AI, image and speech server executables"
command = "cargo"
args = ["build", "--release", "--locked", "-p", "zipeek-ai-server", "-p", "zipeek-image-server", "-p", "zipeek-tts-stt"]

[tasks.release-cli-build]
dependencies = ["duckdb-env"]
description = "Explicitly rebuild the release CLI before verified packaging"
command = "cargo"
args = ["build", "--release", "--locked", "-p", "zipeek-cli"]

[tasks.desktop-sidecars-release]
description = "Rebuild release services and CLI, then stage installer sidecars"
 dependencies = ["duckdb-env", "desktop-servers-build-release", "release-cli-build"]
 command = "target/release/zipeek-cli.exe"
 args = ["desktop-sidecars", "--release"]

[tasks.desktop-dev]
description = "Stage already built sidecars and launch Tauri desktop development"
dependencies = ["duckdb-env", "desktop-sidecars", "docs"]
cwd = "crates/zipeek-app"
command = "cargo"
args = ["tauri", "dev"]

[tasks.desktop-build]
description = "Build release sidecars and package the Tauri desktop installer"
dependencies = ["duckdb-env", "desktop-sidecars-release", "docs"]
cwd = "crates/zipeek-app"
command = "cargo"
args = ["tauri", "build"]

[tasks.image-server]
description = "Run the loopback-only image service (placeholder backend by default)"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-image-server", "--"]

[tasks.image-server-sdxl]
description = "Run local CUDA SDXL Base inference using files in ZIPEEK_IMAGE_MODEL_DIR (default workspace models/sdxl)"
env = { ZIPEEK_IMAGE_BACKEND = "sdxl" }
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-image-server", "--"]

[tasks.image-server-test]
description = "Run image-server unit tests"
command = "cargo"
args = ["test", "-p", "zipeek-image-server", "-p", "zipeek-tts-stt"]

[tasks.pack]
dependencies = ["duckdb-env"]
 description = "Pack source using the prebuilt release CLI; no implicit Cargo build"
 command = "target/release/zipeek-cli.exe"
 args = ["pack"]

[tasks.pack-verified]
description = "Run the locked Rust release gates before packaging a source checkpoint"
dependencies = ["release-check", "release-cli-build", "pack"]

[tasks.e2e-evidence-audit-tests]
description = "Run Rust E2E evidence ownership and integrity regression tests"
 command = "cargo"
 args = ["test", "--locked", "-p", "zipeek-cli", "evidence::tests"]

[tasks.pack-e2e]
dependencies = ["duckdb-env"]
description = "Package all E2E suites from the latest clean invocation for upload"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "pack-e2e", "--all"]

[tasks.unpack]
dependencies = ["duckdb-env"]
 description = "Restore latest source archive using the prebuilt release CLI; no implicit Cargo build"
 command = "target/release/zipeek-cli.exe"
 args = ["unpack"]

[tasks.db-compress]
dependencies = ["duckdb-env"]
description = "Gzip the latest verified dictionary candidate and update its manifest using native Rust"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "db-compress"]

# R235: one local release gate, matching the mandatory CI quality checks.
# Run before creating or publishing a numbered source archive.
[tasks.pedagogy-worker]
dependencies = ["duckdb-env"]
description = "Build pinned isolated Rust/WASM pedagogy Worker bindings via zipeek-cli"
command = "cargo"
args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "pedagogy-worker"]

[tasks.asset-integrity-source]
dependencies = ["duckdb-env"]
 description = "Validate Docs and source assets through Rust preflight"
 command = "cargo"
 args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "verify-assets"]

[tasks.asset-integrity-deploy]
dependencies = ["duckdb-env"]
 description = "Validate deployment assets and require generated pedagogy worker"
 command = "cargo"
 args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "verify-assets", "--require-worker"]

[tasks.asset-integrity-tests]
description = "Run native asset preflight regression tests"
 command = "cargo"
 args = ["test", "--locked", "-p", "zipeek-cli", "asset_preflight::tests"]

[tasks.preflight-source]
dependencies = ["duckdb-env", "asset-integrity-source"]
description = "Verify complete Docs publication, Courses artwork, and worker bootstrap (bindings optional)"
command = "cargo"
args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "verify-assets"]

[tasks.preflight-deploy]
dependencies = ["duckdb-env", "asset-integrity-deploy"]
description = "Verify Docs, Courses artwork and generated Rust/WASM worker assets before Trunk"
command = "cargo"
args = ["run", "--locked", "-p", "zipeek-cli", "--", "build", "verify-assets", "--require-worker"]

[tasks.release-format]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.release-native]
command = "cargo"
args = ["check", "--workspace", "--locked"]

[tasks.release-wasm]
command = "cargo"
args = ["check", "-p", "zipeek-web", "--target", "wasm32-unknown-unknown", "--locked"]

[tasks.release-clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[tasks.release-check]
description = "Required Rust formatting, native/WASM compilation, and Clippy checks before packaging"
dependencies = ["release-format", "release-native", "release-wasm", "release-clippy"]

[tasks.prepare-backgrounds]
dependencies = ["duckdb-env"]
description = "Validate bundled WebP backgrounds and embed the Lavender first-paint image using the Rust CLI"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "web", "prepare-backgrounds"]

[tasks.geo-fetch]
dependencies = ["duckdb-env"]
description = "Fetch or reuse the pinned AreaCity geography source for local Province Quest development"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "geo", "fetch", "--provider", "areacity", "--output", "target/geo-workflow/areacity"]

[tasks.geo-audit]
description = "Audit the pinned AreaCity hierarchy and geometry before generating game assets"
dependencies = ["duckdb-env", "geo-fetch"]
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "geo", "audit", "--provider", "areacity", "--input", "target/geo-workflow/areacity"]

[tasks.geo-build]
description = "Build Province Quest geography from validated pinned source data"
dependencies = ["duckdb-env", "geo-audit"]
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "geo", "build", "--provider", "areacity", "--input", "target/geo-workflow/areacity", "--output", "crates/zipeek-web/static/province-quest"]

[tasks.geo-install]
description = "Fetch, audit and install local-only Province Quest geometry"
dependencies = ["geo-build"]

[tasks.install]
description = "Explicit full local setup: web assets, dictionary, geography, pedagogy worker, docs and deploy checks"
dependencies = ["setup-all", "db-generate", "db-compress", "db-install", "geo-install", "pedagogy-worker", "preflight-deploy"]

[tasks.e2e-wasm]
description = "Validate the browser WASM application before E2E compilation"
command = "cargo"
args = ["check", "--locked", "--target", "wasm32-unknown-unknown", "-p", "zipeek-web"]

[tasks.e2e-compile]
description = "Compile all E2E targets after checking the browser WASM application"
dependencies = ["e2e-wasm"]
command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--tests", "--no-run"]

[tasks.e2e-clean]
dependencies = ["duckdb-env"]
description = "Remove old E2E evidence before starting a full managed test invocation"
command = "cargo"
args = ["run", "--quiet", "--release", "-p", "zipeek-cli", "--locked", "--", "e2e-clean"]

[tasks.e2e-full]
description = "Run all managed Chrome E2E suites, including root and Pages routes, accessibility and interactive journeys"
dependencies = ["e2e-compile", "e2e-clean"]
command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--tests", "--", "--test-threads=1", "--nocapture"]

[tasks.e2e-games-and-services]
description = "Run extended browser E2E journeys for Time Weaver, Icon Pairs and web/native Settings isolation"
dependencies = ["e2e-compile", "e2e-clean"]
command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--test", "time_weaver_options", "--test", "icon_pairs_journey", "--test", "browser_native_services", "--", "--test-threads=1", "--nocapture"]

[tasks.e2e-full-standard]
