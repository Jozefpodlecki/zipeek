command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--test", "exercise_type_journeys", "--test", "course_interactions", "--test", "exercise_interactions", "--test", "practice_answer_options", "--", "--test-threads=1", "--nocapture"]

[tasks.e2e-ai-games-and-exercise-completion]
description = "Complete deterministic AI mini-games and verify authored Practice grading, review and continuation"
dependencies = ["e2e-wasm", "e2e-clean"]
command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--test", "ai_game_journeys", "--test", "exercise_type_journeys", "--", "--test-threads=1", "--nocapture"]

[tasks.e2e-authored-session-completion]
description = "Complete every authored Practice format with accepted answers, check final summary and reload persistence"
dependencies = ["e2e-compile", "e2e-clean"]
command = "cargo"
args = ["test", "--release", "--locked", "-p", "zipeek-e2e", "--test", "authored_session_completion", "--", "--test-threads=1", "--nocapture"]
